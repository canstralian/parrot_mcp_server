[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parrot-mcp-server"
version = "0.1.0"
description = "Parrot MCP Server — enterprise red/purple team orchestration via Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
full = ["psycopg2-binary>=2.9.0", "redis>=5.0.0"]
dev = ["pytest>=8.0.0", "fakeredis>=2.0.0"]

[project.scripts]
parrot-mcp = "parrot_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parrot_mcp_server"]

[tool.mypy]
python_version = "3.11"
strict = true
